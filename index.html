<script>
const S=document.getElementById('S');let name='',pts=0,done={},mute=false,AC;

(()=>{const D=document,E=D.documentElement,rq=E.requestFullscreen||E.webkitRequestFullscreen,ex=D.exitFullscreen||D.webkitExitFullscreen,

/* tombol manual */
const btn=D.getElementById('fs'),IN='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',OUT='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
if(can&&!standalone){btn.style.display='flex';const sync=()=>{const f=!!fsEl();btn.innerHTML=f?OUT:IN;btn.title=f?'Keluar layar penuh':'Layar penuh'};sync();
['fullscreenchange','webkitfullscreenchange'].forEach(n=>D.addEventListener(n,()=>{sync();setTimeout(fit,150);setTimeout(fit,500)}));
btn.addEventListener('click',async e=>{e.stopPropagation();if(fsEl()){try{await ex.call(D)}catch(_){}}else enter()})}
/* petunjuk iPhone: tambah ke layar utama */
if(ios&&!can&&!standalone){let seen=0;try{seen=localStorage.getItem('rn_ios_tip')}catch(_){}
if(!seen){const t=D.getElementById('ios');t.style.display='block';const close=()=>{t.style.display='none';try{localStorage.setItem('rn_ios_tip','1')}catch(_){}};D.getElementById('iosx').onclick=close;setTimeout(close,15000)}}
})();
const el=h=>{const t=document.createElement('div');t.innerHTML=h.trim();return t.firstChild};
const shuf=a=>[...a].sort(()=>Math.random()-.5);
/* ---------- AUDIO ---------- */
function ac(){if(!AC)AC=new(window.AudioContext||webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC}
function tone(f,t,d,ty='sine',v=.15){if(mute)return;const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+d);o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+d)}
const SFX={click:()=>tone(720,0,.08,'square',.05),ok:()=>[523,659,784].forEach((f,i)=>tone(f,i*.1,.25,'triangle')),bad:()=>[300,220].forEach((f,i)=>tone(f,i*.15,.3,'sawtooth',.07)),win:()=>[523,659,784,1046,784,1046,1318,1568].forEach((f,i)=>tone(f,i*.13,.35,'triangle'))};
let bgT=0;function bg(){if(bgT)return;const ch=[[262,330,392,523],[220,277,330,440],[175,220,262,349],[196,247,294,392]];let i=0;const p=()=>{ch[i++%4].forEach((f,k)=>tone(f,k*.4,.9,'sine',.035))};p();bgT=setInterval(p,1700)}

/* ---------- UTIL UI ---------- */

const P=(n,p)=>{if(!done[n])pts+=p;upd()};const upd=()=>{const e=document.getElementById('pts');if(e)e.textContent=pts};

const ANC = d => d.t=='pc'?{t:-18,b:58,hw:58} : d.t=='sw'?{t:-17,b:30,hw:56} : d.t=='rt'?{t:-14,b:17,hw:41} : {t:-68,b:60,hw:50};
function computeLinks(){
    const G={}, groups={};
    Lk.forEach(([a,c])=>{
        const A=D.find(x=>x.id==a),B=D.find(x=>x.id==c); if(!A||!B) return;
        let h=B,o=A; if(A.t=='sw'&&B.t!='sw'){h=A;o=B}
        const ha=ANC(h);
        let cls; if(Math.abs(o.x-h.x)<=ha.hw+8) cls=o.y<h.y?'T':'B'; else cls=o.x<h.x?'L':'R';
        const k=h.id+cls; (groups[k]=groups[k]||[]).push({o,h,cls,key:Math.min(a,c)+'-'+Math.max(a,c)});
    });
    Object.values(groups).forEach(arr=>{
        const cls=arr[0].cls, n=arr.length;
        arr.sort((p,q)=>(cls=='T'||cls=='B')?p.o.x-q.o.x:p.o.y-q.o.y);
        arr.forEach((it,i)=>{
            const {o,h}=it, ao=ANC(o), ah=ANC(h), off=(i-(n-1)/2)*(cls=='T'||cls=='B'?8:5);
            const hubAbove=h.y<o.y;
            const oy = hubAbove ? o.y+ao.t : o.y+ao.b;
            let pts;
            if(cls=='T'||cls=='B'){
                const ey = cls=='T' ? h.y+ah.t : h.y+ah.b, ym=(oy+ey)/2;
                pts=[{x:o.x,y:oy},{x:o.x,y:ym},{x:h.x+off,y:ym},{x:h.x+off,y:ey}];
            } else {
                const dir=cls=='L'?-1:1, ly=h.y+2+off, ex=h.x-dir*0;
                const sameRow=Math.abs(o.y-h.y)<24;
                const sx=sameRow ? o.x-dir*ao.hw*0.6 : o.x, sy=sameRow ? o.y+14 : oy;
                pts=[{x:sx,y:sy},{x:sx,y:ly},{x:h.x+dir*ah.hw,y:ly}];
            }
            G[it.key]={pts,first:o.id};
        });
    });
    return G;
}
const roundPath=(pts,r=10)=>{
    const P=pts.filter((p,i)=>i==0||Math.hypot(p.x-pts[i-1].x,p.y-pts[i-1].y)>0.5);
    if(P.length<2) return '';
    let d=`M${P[0].x} ${P[0].y}`;
    for(let i=1;i<P.length-1;i++){
        const p0=P[i-1],p1=P[i],p2=P[i+1];
        const d1=Math.hypot(p1.x-p0.x,p1.y-p0.y),d2=Math.hypot(p2.x-p1.x,p2.y-p1.y),rr=Math.min(r,d1/2,d2/2);
        const ax=p1.x-(p1.x-p0.x)/d1*rr,ay=p1.y-(p1.y-p0.y)/d1*rr,bx=p1.x+(p2.x-p1.x)/d2*rr,by=p1.y+(p2.y-p1.y)/d2*rr;
        d+=` L${ax} ${ay} Q${p1.x} ${p1.y} ${bx} ${by}`;
    }
    const L=P[P.length-1]; return d+` L${L.x} ${L.y}`;
};
const polyPt=(pts,u)=>{
    let tot=0;const seg=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);seg.push(l);tot+=l}
    let t=Math.max(0,Math.min(1,u))*tot;
    for(let i=0;i<seg.length;i++){ if(t<=seg[i]||i==seg.length-1){const f=seg[i]?t/seg[i]:0;return{x:pts[i].x+(pts[i+1].x-pts[i].x)*f,y:pts[i].y+(pts[i+1].y-pts[i].y)*f}} t-=seg[i]; }
    return pts[0];
};
const linkPt=(a,b,u)=>{
    const g=LG[Math.min(a.id,b.id)+'-'+Math.max(a.id,b.id)]; if(!g) return {x:a.x,y:a.y};
    return polyPt(g.pts, g.first==a.id?u:1-u);
};
const cableSvg = pts => {
    const d=roundPath(pts); if(!d) return '';
    const f=pts[0],l=pts[pts.length-1];
    return `<path d="${d}" transform="translate(0,2.5)" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="${d}" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="${d}" fill="none" stroke="#93c5fd" stroke-width="1" stroke-linecap="round" opacity=".65" transform="translate(0,-1)"/>
<path d="${d}" fill="none" stroke="#cbd5e1" stroke-width="5.5" stroke-linecap="butt" stroke-dasharray="2 46" opacity=".8"/>
<circle cx="${l.x}" cy="${l.y}" r="3.6" fill="#fbbf24" stroke="#92400e"/><circle cx="${f.x}" cy="${f.y}" r="3" fill="#fbbf24" stroke="#92400e"/>`;
};

let isDragging = false, dragNode = null, startX = 0, startY = 0, offsetX = 0, offsetY = 0;

const getMousePos = (evt) => {const p=cv.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;const q=p.matrixTransform(cv.getScreenCTM().inverse());return {x:q.x,y:q.y}};

cv.addEventListener('pointerdown', e => {
    const target = e.target.closest('.nd-sim');
    if (!target) return;
    const id = target.dataset.id;
    dragNode = D.find(x => x.id == id);
    if (!dragNode) return;

    const pos = getMousePos(e);
    offsetX = dragNode.x - pos.x;
    offsetY = dragNode.y - pos.y;
    
    startX = e.clientX; startY = e.clientY;
    isDragging = false;
    cv.setPointerCapture(e.pointerId);
});

cv.addEventListener('pointermove', e => {
    if (!dragNode) return;
    const pos = getMousePos(e);
    
    if (Math.hypot(e.clientX - startX, e.clientY - startY) > 5) {
        isDragging = true;
    }
    
    if (isDragging) {
        dragNode.x = pos.x + offsetX;
        dragNode.y = pos.y + offsetY;
        draw();
    }
});

cv.addEventListener('pointerup', e => {
    if (dragNode) {
        if (!isDragging) {
            // LOGIKA KLIK (BUKAN DRAG)
            if (delMode) {
                removeDev(dragNode);
            } else if (tool) {
                // Mode Kabel ON
                if (!cab) {
                    cab = dragNode; // Pilih node pertama
                } else {
                    if (cab.id !== dragNode.id) {
                        // Jika klik node berbeda, sambungkan / putuskan kabel
                        const k = Lk.findIndex(l => (l[0]==cab.id && l[1]==dragNode.id) || (l[0]==dragNode.id && l[1]==cab.id));
                        if (k >= 0) Lk.splice(k, 1);
                        else Lk.push([cab.id, dragNode.id]);
                    }
                    cab = null; // Reset pilihan setelah disambungkan
                }
                draw();
            } else {
                // Mode Kabel OFF, buka config IP
                openConfig(dragNode);
            }
        }
        dragNode = null;
        cv.releasePointerCapture(e.pointerId);
    }
});

let pkRAF = 0;
// cari jalur host -> router, hanya lewat Switch
const routeTo = (a,r) => {
    const prev={}; prev[a.id]=null; const q=[a];
    while(q.length){
        const x=q.shift(); if(x.id==r.id) break;
        for(const l of Lk){
            const o=l[0]==x.id?l[1]:l[1]==x.id?l[0]:null;
            if(o==null||(o in prev)) continue;
            const n=D.find(z=>z.id==o); if(!n) continue;
            if(n.t!='sw'&&n.id!=r.id) continue;
            prev[o]=x.id; q.push(n);
        }
    }
    if(!(r.id in prev)) return null;
    const path=[]; let c=r.id; while(c!=null){path.unshift(c); c=prev[c];}
    return path;
};
function animatePing(uniq){
    cancelAnimationFrame(pkRAF);
    const g=cv.querySelector('#pk'); if(!g) return;
    const rt=D.find(x=>x.t=='rt');
    const hosts=D.filter(x=>x.t=='pc'||x.t=='sv');
    const SEG=650, GAP=260;
    const pk=hosts.map((h,i)=>{
        const ok=!uniq.some(e=>e.startsWith(h.name+' ')||/^(IP )?Router /.test(e));
        const path=rt?routeTo(h,rt):null;
        return {h,ok,path,t0:i*GAP};
    });
    if(!pk.length){g.innerHTML='';return;}
    const start=performance.now();
    const node=id=>D.find(z=>z.id==id);
    const mark=(x,y,good)=>`<g transform="translate(${x},${y})"><circle r="10" fill="${good?'#16a34a':'#dc2626'}" stroke="#fff" stroke-width="2"/><text y="4.5" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">${good?'✔':'✖'}</text></g>`;
    const packet=(x,y,c)=>`<g transform="translate(${x},${y})"><circle r="11" fill="${c}" opacity=".28"/><rect x="-7" y="-5" width="14" height="10" rx="2" fill="${c}" stroke="#fff" stroke-width="1.5"/><path d="M-7 -5 L0 1 L7 -5" fill="none" stroke="#fff" stroke-width="1.2"/></g>`;
    const tick=now=>{
        if(!cv.isConnected) return;
        const el=now-start; let s='',alive=false;
        for(const p of pk){
            const h=node(p.h.id); if(!h) continue;
            const e=el-p.t0; if(e<0){alive=true;continue;}
            const hp={x:h.x,y:h.y+8};
            if(!p.path||p.path.length<2){ // tidak ada jalur: paket gagal keluar dari komputer
                if(e<1800){alive=true;if(e>250)s+=mark(hp.x,hp.y-48,false);} continue;
            }
            const nodes=p.path.map(node); if(nodes.some(n=>!n)) continue;
            const n=nodes.length-1, sf=e/SEG;
            const total=p.ok?2*n:n;
            if(sf<total){
                alive=true;
                let k,u,col;
                if(sf<n){k=Math.floor(sf);u=sf-k;col='#fbbf24';}
                else{const j=sf-n;k=n-1-Math.floor(j);u=1-(j-Math.floor(j));col='#4ade80';}
                const pt=linkPt(nodes[k],nodes[k+1],u);
                // paket kembali digambar bila arah dibalik: kurva sama, u dibalik
                s+=packet(pt.x,pt.y,p.ok?col:'#fbbf24');
            } else if(e<total*SEG+1800){
                alive=true;
                const endN=p.ok?nodes[0]:nodes[n];
                s+=mark(endN.x,endN.y-(p.ok?48:50),p.ok);
            }
        }
        g.innerHTML=s;
        if(alive) pkRAF=requestAnimationFrame(tick); else g.innerHTML='';
    };
    pkRAF=requestAnimationFrame(tick);
}

    const net=i=>i.split('.').slice(0,3).join('.');
    const byId=id=>D.find(x=>x.id==id);
    const viaSwitch=(a,c)=>{const seen=new Set([a.id]),q=[a];while(q.length){const x=q.shift();for(const l of Lk){const o=l[0]==x.id?l[1]:l[1]==x.id?l[0]:null;if(o==null||seen.has(o))continue;const n=byId(o);if(!n)continue;if(n.id==c.id&&x.t=='sw')return true;if(n.t=='sw'){seen.add(o);q.push(n)}}}return false};
    const hasSw=d=>Lk.some(l=>(l[0]==d.id||l[1]==d.id)&&[l[0],l[1]].some(i=>{const n=byId(i);return n&&n.id!=d.id&&n.t=='sw'}));
    const sws=D.filter(x=>x.t=='sw'),rts=D.filter(x=>x.t=='rt'),pcs=D.filter(x=>x.t=='pc'),svs=D.filter(x=>x.t=='sv');
    const hosts=pcs.concat(svs),rt=rts[0];

    if(!sws.length) er.push('Belum ada Switch.');
    if(!rt) er.push('Belum ada Router (dibutuhkan sebagai Gateway).');
    if(!hosts.length) er.push('Belum ada Komputer atau Server.');

    if(mode==4&&phase==2){
        if(sws.length!==1) er.push('Harus ada tepat 1 Switch.');
        if(pcs.length!==3) er.push('Harus ada tepat 3 Komputer.');
        if(svs.length!==1) er.push('Harus ada 1 Server.');
        if(rts.length!==1) er.push('Harus ada 1 Router.');
    }

    Lk.forEach(l=>{const a=byId(l[0]),c=byId(l[1]);if(a&&c&&a.t!='sw'&&c.t!='sw')er.push(`${a.name} dan ${c.name} tidak boleh dihubungkan langsung. Gunakan Switch.`)});

    let rtok=false;
    if(rt){
        if(!hasSw(rt)) er.push('Router belum terhubung ke Switch.');
        if(!ipok(rt.ip)) er.push('IP Router belum diisi atau tidak valid.');
        else if(!host(rt.ip)) er.push('IP Router tidak boleh berakhiran .0 atau .255.');
        else rtok=true;
        if(rtok&&mode==4&&phase==2&&rt.ip!=='192.168.1.1') er.push('IP Router harus 192.168.1.1.');
    }

    hosts.forEach(p=>{
        if(!hasSw(p)){er.push(`${p.name} kabel belum terhubung ke Switch.`)}
        else if(rt&&hasSw(rt)&&!viaSwitch(p,rt)) er.push(`${p.name} tidak satu jaringan dengan Router (Switch belum saling terhubung).`);
        if(!ipok(p.ip)){er.push(`${p.name} IP belum diisi atau tidak valid.`)}
        else{
            if(!host(p.ip)) er.push(`${p.name} IP tidak boleh berakhiran .0 atau .255.`);
            if(rtok){
                if(net(p.ip)!==net(rt.ip)) er.push(`${p.name} beda subnet dengan Router (harus ${net(rt.ip)}.x).`);
                if(p.ip===rt.ip) er.push(`${p.name} IP sama dengan IP Router.`);
            }
            const dup=hosts.find(o=>o!==p&&o.ip===p.ip);
            if(dup) er.push(`${p.name} IP ganda dengan ${dup.name}.`);
            if(rt&&rt.ip===p.ip&&!rtok) er.push(`${p.name} IP sama dengan Router.`);
        }
        if(!ipok(p.gw)) er.push(`${p.name} Gateway belum diisi atau tidak valid.`);
        else if(rtok&&p.gw!==rt.ip) er.push(`${p.name} Gateway salah (harus sama dengan IP Router: ${rt.ip}).`);
    });

    if(mode==4&&phase==2){
        const want=['192.168.1.10','192.168.1.11','192.168.1.12'];
        if(pcs.length==3&&!pcs.every(p=>!ipok(p.ip)||want.includes(p.ip))) er.push('IP Komputer harus 192.168.1.10, .11 dan .12.');
        svs.forEach(v=>{if(ipok(v.ip)&&v.ip!=='192.168.1.20') er.push('IP Server harus 192.168.1.20.')});
    }

    const uniq=[...new Set(er)];
    animatePing(uniq);
    if(mode==4&&phase==1){
        if(!uniq.length){ SFX.ok(); log('<span style="color:#6f6">✔ Konfigurasi benar. Semua perangkat saling terhubung. Silakan lanjut ke tantangan.</span>'); }
        else { SFX.bad(); uniq.forEach(e=>log(`<span style="color:#f88">✖ ${e}</span>`)); }
        return;
    }
    if(!uniq.length){
        if(awarded) return;
        awarded=true;
        SFX.ok(); P(mode,mode==4?50:100);
        log('<span style="color:#6f6">✔ Semua perangkat berhasil saling terhubung.</span>');
        const f=el(`<div class="fb g" style="font-size:17px">🎉 Hebat, ${name}! Misi berhasil!<br><button class="btn o">SELESAI MISI</button></div>`);
        tl.appendChild(f); f.querySelector('button').onclick=()=>{b.close();finish(mode)};
    } else {
        SFX.bad(); log('Belum berhasil, tetap semangat!');
        uniq.forEach(e=>log(`<span style="color:#f88">✖ ${e}</span>`));
    }
};
